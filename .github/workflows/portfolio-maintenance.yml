# ポートフォリオ固有の保守作業 - 月1回の定期アラート
# Claude Code手動実行のためのリマインダー
name: Portfolio Maintenance Reminder

on:
  # 一時的に無効化（権限設定後に有効化）
  # schedule:
  #   - cron: '0 9 1 * *'  # 毎月1日の午前9時（UTC）
  
  # 手動実行のみ
  workflow_dispatch:

# ワークフロー全体の権限設定
permissions:
  issues: write
  contents: read

jobs:
  maintenance_reminder:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Create Monthly Maintenance Issue
        uses: actions/github-script@v7
        with:
          script: |
            const currentDate = new Date().toLocaleDateString('ja-JP', {
              year: 'numeric',
              month: 'long'
            });
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔧 ${currentDate} 月次保守チェック`,
              body: `## ${currentDate}の月次保守チェック
            
            ポートフォリオプロジェクトの定期保守作業を実行してください。
            
            ## 手動でClaude Codeを使用してチェック
            
            1. [Claude Code](https://claude.ai/code)を開く
            2. このリポジトリに接続
            3. 以下のコマンドを実行：
            
            \`\`\`
            ポートフォリオプロジェクトの月次ヘルスチェックを実行してください。
            
            確認項目：
            1. package.json の依存関係の最新版確認
            2. CLAUDE.md の情報が現在のプロジェクト状態と一致しているか
            3. 使用していない古いファイルやコンポーネントがないか
            4. セキュリティの問題がないか
            5. パフォーマンスの改善点はないか
            
            問題があれば簡潔にレポートし、必要に応じてCLAUDE.mdを更新してください。
            問題がなければ「✅ ヘルスチェック完了：問題なし」とコメントしてください。
            \`\`\`
            
            ## チェックリスト
            
            - [ ] 依存関係の確認
            - [ ] CLAUDE.mdの更新確認
            - [ ] 未使用ファイルの確認
            - [ ] セキュリティチェック
            - [ ] パフォーマンス確認
            
            ## 完了後
            - チェック結果をコメントに記録
            - このIssueをクローズ
            
            ---
            🤖 自動生成された月次リマインダー`,
              labels: ['maintenance', 'monthly', 'health-check']
            })